<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Wigell Car Rental</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="admin-page">

    <header class="top-header">

        <img src="images/koncernLogga.png" alt="Wigellkoncernens logga" class="logo">

        <nav class="top-nav">

            <div class="nav-links">

                <a href="index.html">Startsida</a>

                <a href="#users-section">Användare</a>

                <a href="#bookings-section">Bokningar</a>

            </div>

        </nav>

        <div class="header-buttons">

            <button class="btn negative-btn" onclick="logout()">
                Logga ut
            </button>

        </div>

    </header>

    <main class="admin-main">

        <section class="admin-hero">
            <h1>Administrationspanel</h1>
            <p>Här kan administratören hantera användare och bokningar.</p>
        </section>

        <section id="users-section">
            <h2>Användare</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>
                                <button class="table-sort-btn" onclick="sortUsersBy('id')">
                                    ID
                                </button>
                            </th>

                            <th>
                                <button class="table-sort-btn" onclick="sortUsersBy('username')">
                                    Användarnamn
                                </button>
                            </th>

                            <th>
                                <button class="table-sort-btn" onclick="sortUsersBy('firstName')">
                                    Förnamn
                                </button>
                            </th>

                            <th>
                                <button class="table-sort-btn" onclick="sortUsersBy('lastName')">
                                    Efternamn
                                </button>
                            </th>

                            <th>
                                <button class="table-sort-btn" onclick="sortUsersBy('email')">
                                    E-post
                                </button>
                            </th>

                            <th>
                                <button class="table-sort-btn" onclick="sortUsersBy('role')">
                                    Roll
                                </button>

                            </th>
                        </tr>
                    </thead>
                    <tbody id="admin-container"></tbody>
                </table>
            </div>
        </section>

        <section id="bookings-section">
            <h2>Bokningar</h2>

            <div class="panel neutral-panel admin-search-box">


                <label for="booking-id-search">Boknings-ID</label>

                <input type="text" id="booking-id-search" placeholder="Sök boknings-ID">

                <button class="btn standard-btn" onclick="searchBookings()">
                    Sök
                </button>

                <button class="btn function-btn" onclick="getAllBookings()">
                    Visa alla bokningar
                </button>

            </div>

            <div id="all-bookings-container"></div>
        </section>

    </main>

    <script>
        const user = JSON.parse(sessionStorage.getItem("user"));

        if (!user || !user.isAdmin) {
            window.location.replace("index.html");
        }
    </script>


    <script src="js/app.js"></script>

    <script>

        getCars();
        getAllUsers();
        getAllBookings();

    </script>

</body>

</html>
